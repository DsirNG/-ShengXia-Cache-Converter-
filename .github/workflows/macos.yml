name: Build Windows installer and macOS DMGs
on:
  workflow_dispatch:
jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      tools_release: v0.2.0-rc.1
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: python -m pip install -r requirements-build.txt
      - name: Unit and audio integration tests
        run: FFMPEG_BIN_DIR="$(brew --prefix)/bin" python -m unittest discover -v
      - name: Build and check application
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: NCM-Converter-macOS-${{ matrix.arch }}
          path: artifacts/*.dmg
          if-no-files-found: error
