name: Build macOS DMG
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Build and check application
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShengXia-macOS-${{ matrix.arch }}
          path: artifacts/*.dmg
